name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build darwin/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - run: mkdir -p dist
      - run: go build -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" -o dist/dbxcli-darwin-arm64 .
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v7
        with:
          name: dbxcli-darwin-arm64
          path: dist/dbxcli-darwin-arm64
